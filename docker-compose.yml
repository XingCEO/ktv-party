version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ktv-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      KTV_DATA_DIR: /data
      KTV_CORS_ORIGINS: "*"
      KTV_ENABLE_DEMUCS: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8000/healthz\",timeout=2).status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: ktv-web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://api:8000
    depends_on:
      - api
    restart: unless-stopped
