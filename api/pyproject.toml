[project]
name = "ktv-api"
version = "0.1.0"
description = "KTV Box demo - FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "pydantic>=2.9",
    "httpx>=0.27",
    "yt-dlp>=2025.1.0",
    "imageio-ffmpeg>=0.5.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
demucs = [
    "demucs>=4.0.1",
    "torch>=2.4",
    "torchaudio>=2.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
